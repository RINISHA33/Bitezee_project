<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BITEZEE – Order Food</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --g:#81BFB7;--gd:#5aa39b;--gl:#b8ddd9;--gll:#e0f2ef;
  --pk:#F3A2BE;--pd:#e07fa3;--pl:#fbd5e6;--pll:#fef0f6;
  --cr:#FDF8F4;--dk:#141820;--tx:#1e2028;--mu:#7a7a8a;
  --r:16px;--shadow:0 4px 24px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--cr);color:var(--tx);min-height:100vh}

nav{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 5%;background:rgba(253,248,244,.92);
  backdrop-filter:blur(18px);border-bottom:1px solid rgba(129,191,183,.2);
}
.nav-logo{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--gd),var(--pd));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-decoration:none;}
.nav-back{display:flex;align-items:center;gap:6px;text-decoration:none;
  color:var(--mu);font-size:.84rem;font-weight:500;transition:color .2s}
.nav-back:hover{color:var(--gd)}
.nav-right{display:flex;align-items:center;gap:12px}
.cart-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:50px;
  background:linear-gradient(135deg,var(--gd),var(--g));
  color:#fff;font-weight:600;font-size:.84rem;
  border:none;cursor:pointer;font-family:'Outfit',sans-serif;
  transition:transform .2s,box-shadow .2s;
  box-shadow:0 4px 16px rgba(90,163,155,.3);
}
.cart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(90,163,155,.4)}
.cart-count{
  background:#fff;color:var(--gd);
  width:20px;height:20px;border-radius:50%;
  font-size:.7rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.loc-banner{display:flex;align-items:center;gap:10px;background:rgba(129,191,183,.15);border:1px solid rgba(129,191,183,.3);border-radius:50px;padding:8px 16px;font-size:.8rem;color:rgba(255,255,255,.8);position:relative;z-index:1;margin-bottom:16px;width:fit-content;cursor:pointer;transition:background .2s}
.loc-banner:hover{background:rgba(129,191,183,.25)}
.loc-dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(129,191,183,.3);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(129,191,183,.3)}50%{box-shadow:0 0 0 7px rgba(129,191,183,.08)}}
.points-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;padding:7px 14px;border-radius:50px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:transform .2s;box-shadow:0 3px 12px rgba(243,156,18,.3)}
.points-badge:hover{transform:translateY(-2px)}
.claims-header-strip{background:linear-gradient(135deg,var(--dk),#1e2a3a);padding:24px;border-radius:20px 20px 0 0;color:#fff}
.claims-header-strip h2{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:900;margin-bottom:3px}
.claims-header-strip p{font-size:.8rem;color:rgba(255,255,255,.45)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 18px 0}
.stat-box{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.stat-box .sval{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:900;line-height:1}
.stat-box .slbl{font-size:.66rem;color:var(--mu);margin-top:4px;line-height:1.3}
.stat-box.money .sval{color:var(--gd)}
.stat-box.carbon .sval{color:#27ae60}
.stat-box.meals .sval{color:var(--pd)}
.points-card{margin:14px 18px 0;background:linear-gradient(135deg,#f39c12,#e67e22);border-radius:16px;padding:16px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.points-card .pleft h3{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:900;line-height:1}
.points-card .pleft p{font-size:.74rem;opacity:.8;margin-top:2px}
.points-card .pright{text-align:right}
.level-badge{font-size:.74rem;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:50px}
.next-level{font-size:.68rem;opacity:.7;margin-top:6px}
.progress-track{height:6px;background:rgba(255,255,255,.25);border-radius:50px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:#fff;border-radius:50px;transition:width .8s ease}
.eco-section{padding:14px 18px 0}
.eco-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:9px}
.eco-cards{display:flex;flex-direction:column;gap:7px}
.eco-card{display:flex;align-items:center;gap:11px;background:var(--gll);border-radius:12px;padding:11px 13px}
.eco-card .eico{font-size:1.5rem}
.eco-card strong{display:block;font-size:.84rem;color:var(--gd)}
.eco-card span{font-size:.74rem;color:var(--mu)}
.claims-list{padding:14px 18px 18px}
.claim-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.claim-item:last-child{border-bottom:none}
.claim-emoji{font-size:1.7rem}
.claim-info{flex:1}
.claim-info .cname{font-weight:600;font-size:.86rem}
.claim-info .cmeta{font-size:.72rem;color:var(--mu);margin-top:2px}
.claim-pts{font-size:.76rem;font-weight:700;color:#f39c12;white-space:nowrap}
.no-claims{text-align:center;padding:30px 18px;color:var(--mu)}
.no-claims .ne{font-size:2.4rem;margin-bottom:9px}
.no-claims p{font-size:.84rem;line-height:1.6}
.hero-strip{
  background:linear-gradient(135deg,var(--dk) 0%,#1e2a3a 100%);
  padding:48px 5% 40px;position:relative;overflow:hidden;
}
.hero-strip::before{
  content:'';position:absolute;top:-100px;right:-100px;
  width:360px;height:360px;background:var(--g);
  border-radius:50%;filter:blur(100px);opacity:.12;
}
.hero-strip::after{
  content:'';position:absolute;bottom:-80px;left:-80px;
  width:280px;height:280px;background:var(--pk);
  border-radius:50%;filter:blur(90px);opacity:.1;
}
.hero-strip h1{
  font-family:'Fraunces',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);
  font-weight:900;color:#fff;margin-bottom:8px;position:relative;z-index:1;
}
.hero-strip h1 span{
  background:linear-gradient(120deg,var(--g),var(--pk));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-strip p{color:rgba(255,255,255,.5);font-size:.94rem;position:relative;z-index:1;margin-bottom:24px}

.search-bar{
  display:flex;gap:10px;align-items:center;
  position:relative;z-index:1;max-width:600px;
}
.search-bar input{
  flex:1;padding:13px 18px;border-radius:50px;
  border:none;font-size:.9rem;font-family:'Outfit',sans-serif;
  outline:none;background:rgba(255,255,255,.1);
  color:#fff;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  transition:background .2s,border .2s;
}
.search-bar input::placeholder{color:rgba(255,255,255,.4)}
.search-bar input:focus{background:rgba(255,255,255,.15);border-color:var(--g)}
.search-bar button{
  padding:13px 22px;border-radius:50px;
  background:var(--g);border:none;color:#fff;
  font-weight:600;font-size:.88rem;cursor:pointer;
  font-family:'Outfit',sans-serif;white-space:nowrap;
  transition:background .2s;
}
.search-bar button:hover{background:var(--gd)}

.filters{display:flex;gap:8px;padding:20px 5% 0;flex-wrap:wrap}
.chip{
  padding:7px 16px;border-radius:50px;
  border:1.5px solid rgba(129,191,183,.3);
  background:#fff;color:var(--mu);
  font-size:.78rem;font-weight:600;cursor:pointer;
  transition:all .2s;font-family:'Outfit',sans-serif;
}
.chip:hover,.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip.pk:hover,.chip.pk.on{background:var(--pk);color:#fff;border-color:var(--pk)}

.main{padding:28px 5%}
.section-label{
  font-family:'Fraunces',serif;font-size:1.3rem;font-weight:900;
  margin-bottom:18px;color:var(--dk);
}
.section-label span{color:var(--gd)}

.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:40px}
.rest-card{
  background:#fff;border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .3s,box-shadow .3s;
  animation:fadeUp .5s ease both;
}
.rest-card:hover{transform:translateY(-5px);box-shadow:0 12px 36px rgba(0,0,0,.12)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rest-card:nth-child(2){animation-delay:.08s}
.rest-card:nth-child(3){animation-delay:.16s}
.rest-card:nth-child(4){animation-delay:.24s}
.rest-card:nth-child(5){animation-delay:.32s}
.rest-card:nth-child(6){animation-delay:.40s}

.rest-banner{
  height:140px;display:flex;align-items:center;justify-content:center;
  font-size:3.5rem;position:relative;overflow:hidden;
}
.rest-banner .urgency{
  position:absolute;top:10px;right:10px;
  background:rgba(20,24,32,.82);color:#fff;
  font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:50px;
  backdrop-filter:blur(4px);
}
.rest-banner .free-tag{
  position:absolute;top:10px;left:10px;
  background:var(--g);color:#fff;
  font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:50px;
}
.rest-banner .paid-tag{
  position:absolute;top:10px;left:10px;
  background:var(--pk);color:#fff;
  font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:50px;
}
.rest-body{padding:16px}
.rest-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.rest-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700}
.rest-rating{
  display:flex;align-items:center;gap:4px;
  background:var(--gll);color:var(--gd);
  font-size:.72rem;font-weight:700;
  padding:3px 9px;border-radius:50px;
}
.rest-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:50px;}
.badge.veg{background:#e8f8e8;color:#2e7d2e}
.badge.nonveg{background:#fde8e8;color:#c0392b}
.badge.halal{background:#fff3e0;color:#e65100}
.rest-meta{display:flex;gap:12px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:4px;font-size:.76rem;color:var(--mu)}
.meta-item .dot{width:6px;height:6px;border-radius:50%}
.dot-g{background:var(--gd)}
.dot-p{background:var(--pd)}
.dot-o{background:#f39c12}
.rest-footer{
  border-top:1px solid rgba(0,0,0,.05);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.food-count{font-size:.78rem;color:var(--mu)}
.food-count strong{color:var(--gd);font-weight:700}
.view-btn{
  font-size:.76rem;font-weight:600;color:var(--gd);
  background:var(--gll);border:none;padding:6px 14px;
  border-radius:50px;cursor:pointer;font-family:'Outfit',sans-serif;
  transition:background .2s;
}
.view-btn:hover{background:var(--g);color:#fff}

#detail-view{display:none;animation:fadeUp .4s ease both}
.detail-header{
  background:linear-gradient(135deg,var(--dk),#1e2a3a);
  padding:32px 5%;color:#fff;position:relative;overflow:hidden;
}
.detail-header::before{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;background:var(--g);border-radius:50%;filter:blur(80px);opacity:.1}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.6);font-size:.84rem;cursor:pointer;
  background:none;border:none;font-family:'Outfit',sans-serif;
  margin-bottom:16px;padding:0;transition:color .2s;
}
.back-btn:hover{color:#fff}
.detail-rest-name{font-family:'Fraunces',serif;font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;margin-bottom:8px}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.detail-meta{display:flex;gap:16px;flex-wrap:wrap}
.detail-meta-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:rgba(255,255,255,.6)}
.detail-meta-item strong{color:#fff}

.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding:28px 5%}
.food-item{
  background:#fff;border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);
  animation:fadeUp .4s ease both;
}
.food-item:nth-child(2){animation-delay:.07s}
.food-item:nth-child(3){animation-delay:.14s}
.food-item:nth-child(4){animation-delay:.21s}
.food-banner{height:110px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;}
.food-body{padding:14px}
.food-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.food-name{font-weight:700;font-size:.96rem}
.food-tags{display:flex;gap:5px;margin-bottom:8px}
.food-desc{font-size:.78rem;color:var(--mu);line-height:1.5;margin-bottom:10px}
.food-bottom{display:flex;align-items:center;justify-content:space-between}
.price-block{display:flex;align-items:center;gap:8px}
.old-price{font-size:.78rem;color:var(--mu);text-decoration:line-through}
.new-price{font-size:1.05rem;font-weight:700;color:var(--gd)}
.free-price{font-size:1.05rem;font-weight:700;color:var(--pd)}
.qty-info{font-size:.74rem;color:var(--mu)}
.qty-info strong{color:var(--tx)}
.claim-btn{
  padding:9px 20px;border-radius:50px;
  background:linear-gradient(135deg,var(--gd),var(--g));
  color:#fff;font-weight:600;font-size:.82rem;
  border:none;cursor:pointer;font-family:'Outfit',sans-serif;
  transition:transform .2s,box-shadow .2s;
  box-shadow:0 4px 14px rgba(90,163,155,.3);
}
.claim-btn:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(90,163,155,.4)}
.claim-btn.free{background:linear-gradient(135deg,var(--pd),var(--pk));box-shadow:0 4px 14px rgba(224,127,163,.3)}
.claim-btn.free:hover{box-shadow:0 7px 20px rgba(224,127,163,.4)}
.claim-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(20,24,32,.65);backdrop-filter:blur(4px);
  z-index:500;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.modal{
  background:#fff;border-radius:24px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;
  animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}
.modal-header{
  padding:24px 24px 16px;
  border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1;
  border-radius:24px 24px 0 0;
}
.modal-title{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:900}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--cr);border:none;cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.modal-close:hover{background:var(--pl)}
.modal-body{padding:20px 24px 24px}

.order-summary{background:var(--cr);border-radius:12px;padding:14px;margin-bottom:20px;}
.order-item{display:flex;justify-content:space-between;align-items:center;font-size:.86rem}
.order-item .oname{font-weight:600}
.order-item .oprice{color:var(--gd);font-weight:700}
.order-item .oprice.free{color:var(--pd)}
.order-divider{height:1px;background:rgba(0,0,0,.06);margin:10px 0}

.form-section-title{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:12px;margin-top:18px;}
.form-group{margin-bottom:14px}
.form-group label{font-size:.82rem;font-weight:600;display:block;margin-bottom:6px;color:var(--tx);}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:11px 14px;border:1.5px solid #ebebeb;
  border-radius:10px;font-size:.88rem;font-family:'Outfit',sans-serif;
  outline:none;transition:border .2s;background:#fff;color:var(--tx);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--g)}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pay-options{display:flex;flex-direction:column;gap:10px}
.pay-option{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border:1.5px solid #ebebeb;border-radius:10px;cursor:pointer;
  transition:border .2s,background .2s;
}
.pay-option:hover{border-color:var(--g);background:var(--gll)}
.pay-option.selected{border-color:var(--g);background:var(--gll)}
.pay-option input[type=radio]{accent-color:var(--gd)}
.pay-icon{font-size:1.4rem}
.pay-label{font-weight:600;font-size:.88rem}
.pay-sub{font-size:.74rem;color:var(--mu)}
.upi-input{margin-top:10px}

.submit-btn{
  width:100%;padding:15px;margin-top:20px;
  background:linear-gradient(135deg,var(--gd),var(--g));
  color:#fff;border:none;border-radius:12px;
  font-size:.96rem;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;
  transition:opacity .2s,transform .2s;
  box-shadow:0 5px 20px rgba(90,163,155,.3);
}
.submit-btn:hover{opacity:.92;transform:translateY(-1px)}
.submit-btn.free{background:linear-gradient(135deg,var(--pd),var(--pk));box-shadow:0 5px 20px rgba(224,127,163,.3)}

.success-screen{text-align:center;padding:32px 24px}
.success-icon{font-size:4rem;margin-bottom:16px;animation:bounce .6s ease both}
@keyframes bounce{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.success-title{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:900;margin-bottom:8px;color:var(--gd)}
.success-sub{color:var(--mu);font-size:.9rem;line-height:1.6;max-width:300px;margin:0 auto 24px}
.success-ref{background:var(--gll);border-radius:10px;padding:12px;font-size:.84rem;color:var(--gd);font-weight:600;margin-bottom:20px}
.done-btn{
  padding:12px 32px;border-radius:50px;
  background:linear-gradient(135deg,var(--gd),var(--g));
  color:#fff;font-weight:600;border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:.9rem;
  box-shadow:0 4px 16px rgba(90,163,155,.3);
}

.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.empty .ei{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.9rem}

@media(max-width:640px){
  .rest-grid{grid-template-columns:1fr}
  .food-grid{grid-template-columns:1fr;padding:20px 4%}
  .form-row{grid-template-columns:1fr}
  .hero-strip{padding:32px 4% 28px}
  .main{padding:20px 4%}
  .filters{padding:16px 4% 0}
}
</style>
</head>
<body>

<nav>
  <!-- ✅ LINKED: Logo goes back to landing page -->
  <a href="/" class="nav-logo">BITEZEE</a>
  <div style="display:flex;gap:22px;list-style:none;align-items:center">
    <a href="/" style="text-decoration:none;color:#1e2028;font-weight:500;font-size:.87rem;transition:color .2s" onmouseover="this.style.color='#5aa39b'" onmouseout="this.style.color='#1e2028'">Home</a>
    <a href="/order" style="text-decoration:none;color:#5aa39b;font-weight:700;font-size:.87rem">Order Food</a>
    <a href="/donate" style="text-decoration:none;color:#1e2028;font-weight:500;font-size:.87rem;transition:color .2s" onmouseover="this.style.color='#5aa39b'" onmouseout="this.style.color='#1e2028'">Donate</a>
    <a href="/impact" style="text-decoration:none;color:#1e2028;font-weight:500;font-size:.87rem;transition:color .2s" onmouseover="this.style.color='#5aa39b'" onmouseout="this.style.color='#1e2028'">🌍 Impact</a>

<script>
const restaurants = [

    {id:603,name:"Hummus + Pita",emoji:"🫓",desc:"Leftover hummus with fresh pita bread.",qty:10,oldPrice:80,newPrice:0,type:"free",tags:["veg","halal"]},
  ]}
];

let activeFilter='all',cart=[],claimedItems=[],currentFood=null,currentRest=null,userPoints=0,totalSaved=0,totalMeals=0,userLat=null,userLng=null;
const restCoords={1:{lat:13.085,lng:80.21},2:{lat:13.04,lng:80.23},3:{lat:13.061,lng:80.244},4:{lat:13.079,lng:80.278},5:{lat:13.001,lng:80.255},6:{lat:13.066,lng:80.27}};

function deg2rad(d){return d*(Math.PI/180)}
function getDistKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=deg2rad(lat2-lat1),dLng=deg2rad(lng2-lng1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function requestLocation(){
  const txt=document.getElementById('locText');
  txt.textContent='📡 Getting your location...';
  if(!navigator.geolocation){txt.textContent='❌ Location not supported';return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLat=pos.coords.latitude;userLng=pos.coords.longitude;
      txt.textContent='✅ Location found — sorting by distance!';
      document.getElementById('locBanner').style.background='rgba(129,191,183,.28)';
      restaurants.forEach(r=>{const c=restCoords[r.id];if(c){const d=getDistKm(userLat,userLng,c.lat,c.lng);r.distance=d.toFixed(1)+' km';r.distNum=d;}});
      filterRestaurants();
    },
    err=>{txt.textContent='📍 Location denied — showing default order';}
  );
}

function renderRestaurants(list){
  if(userLat){list=[...list].sort((a,b)=>(a.distNum||99)-(b.distNum||99));}
  const grid=document.getElementById('restGrid');
  document.getElementById('restCount').textContent=list.length;
  if(!list.length){grid.innerHTML='<div class="empty"><div class="ei">🔍</div><p>No restaurants found. Try a different filter!</p></div>';return;}
  grid.innerHTML=list.map(r=>{
    const hasFree=r.foods.some(f=>f.type==='free');
    const hasPaid=r.foods.some(f=>f.type==='paid');
    const tagBadges=r.tags.map(t=>{
      if(t==='veg')return'<span class="badge veg">🥦 Veg</span>';
      if(t==='nonveg')return'<span class="badge nonveg">🍗 Non-Veg</span>';
      if(t==='halal')return'<span class="badge halal">☪️ Halal</span>';
      return'';
    }).join('');
    return`<div class="rest-card" onclick="showDetail(${r.id})">
      <div class="rest-banner" style="background:${r.color}">
        <span>${r.emoji}</span>
        <span class="urgency">⏰ ${r.closingIn}</span>
        ${hasFree?'<span class="free-tag">🎁 Free Items</span>':hasPaid?'<span class="paid-tag">💸 Discounted</span>':''}
      </div>
      <div class="rest-body">
        <div class="rest-top"><div class="rest-name">${r.name}</div><div class="rest-rating">⭐ ${r.rating}</div></div>
        <div class="rest-tags">${tagBadges}</div>
        <div class="rest-meta">
          <div class="meta-item"><span class="dot dot-g"></span>${r.distance}</div>
          <div class="meta-item"><span class="dot dot-o"></span>Closes in ${r.closingIn}</div>
          <div class="meta-item"><span class="dot dot-p"></span>${r.foods.length} items</div>
        </div>
      </div>
      <div class="rest-footer">
        <div class="food-count"><strong>${r.foods.reduce((a,f)=>a+f.qty,0)}</strong> portions left</div>
        <button class="view-btn">View Food →</button>
      </div>
    </div>`;
  }).join('');
}

function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  filterRestaurants();
}

function filterRestaurants(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let list=restaurants.filter(r=>{
    const matchQ=!q||r.name.toLowerCase().includes(q)||r.foods.some(f=>f.name.toLowerCase().includes(q));
    let matchF=true;
    if(activeFilter==='free')matchF=r.foods.some(f=>f.type==='free');
    else if(activeFilter==='paid')matchF=r.foods.some(f=>f.type==='paid');
    else if(activeFilter==='veg')matchF=r.tags.includes('veg');
    else if(activeFilter==='nonveg')matchF=r.tags.includes('nonveg');
    else if(activeFilter==='halal')matchF=r.tags.includes('halal');
    else if(activeFilter==='closing')matchF=parseInt(r.closingIn)<=60;
    return matchQ&&matchF;
  });
  renderRestaurants(list);
}

function showDetail(id){
  const r=restaurants.find(x=>x.id===id);
  currentRest=r;
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  window.scrollTo(0,0);
  document.getElementById('detailName').textContent=r.emoji+' '+r.name;
  document.getElementById('detailBadges').innerHTML=r.tags.map(t=>{
    if(t==='veg')return'<span class="badge veg">🥦 Veg</span>';
    if(t==='nonveg')return'<span class="badge nonveg">🍗 Non-Veg</span>';
    if(t==='halal')return'<span class="badge halal">☪️ Halal</span>';

      if(t==='nonveg')return'<span class="badge nonveg">🍗</span>';

    const priceHtml=f.type==='free'?`<span class="free-price">FREE</span>`:`<span class="old-price">₹${f.oldPrice}</span><span class="new-price">₹${f.newPrice}</span>`;

      <div class="food-banner" style="background:${currentRest.color}"><span>${f.emoji}</span></div>
      <div class="food-body">
        <div class="food-top"><div class="food-name">${f.name}</div></div>
        <div class="food-tags">${tagBadges}</div>
        <div class="food-desc">${f.desc}</div>
        <div class="food-bottom">
          <div><div class="price-block">${priceHtml}</div><div class="qty-info"><strong>${f.qty}</strong> portions left</div></div>
          <button class="claim-btn ${f.type==='free'?'free':''}" onclick="openClaim(${r.id},${f.id})">${f.type==='free'?'🎁 Claim Free':'🛒 Claim'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showList(){
  document.getElementById('detail-view').style.display='none';
  document.getElementById('list-view').style.display='block';
  window.scrollTo(0,0);
}

function openClaim(restId,foodId){
  const r=restaurants.find(x=>x.id===restId);
  const f=r.foods.find(x=>x.id===foodId);

  document.getElementById('modalTitle').textContent=f.type==='free'?'🎁 Claim Free Food':'🛒 Claim Food';
  renderCheckoutForm(f,r);
  document.getElementById('overlay').classList.add('show');

}

function renderCheckoutForm(f,r){
  const isFree=f.type==='free';
  const priceDisplay=isFree?'<span class="oprice free">FREE 🎁</span>':`<span class="oprice">₹${f.newPrice}</span>`;
  document.getElementById('modalBody').innerHTML=`
    <div class="order-summary">
      <div class="order-item"><span class="oname">${f.emoji} ${f.name}</span>${priceDisplay}</div>
      <div class="order-divider"></div>
      <div class="order-item" style="font-size:.78rem;color:var(--mu)"><span>From ${r.name}</span><span>${r.distance} away</span></div>

    ${isFree?'':`
    <div class="form-section-title">Payment — UPI</div>
    <div class="pay-options">
      <label class="pay-option selected" id="payGPay"><input type="radio" name="upi" value="gpay" checked/><span class="pay-icon">🟢</span><div><div class="pay-label">Google Pay</div><div class="pay-sub">Pay via GPay UPI</div></div></label>

    </div>
    <div class="form-group upi-input" id="upiIdGroup" style="display:none;margin-top:10px"><label>Your UPI ID *</label><input type="text" id="fUpi" placeholder="yourname@upi"/></div>
    `}
    <button class="submit-btn ${isFree?'free':''}" onclick="submitClaim()">
      ${isFree?'🎁 Confirm Free Claim':`✅ Pay ₹${f.newPrice} & Confirm`}
    </button>
  `;
  if(!isFree){
    document.querySelectorAll('.pay-option').forEach(opt=>{
      opt.addEventListener('click',function(){
        document.querySelectorAll('.pay-option').forEach(o=>o.classList.remove('selected'));
        this.classList.add('selected');
        document.getElementById('upiIdGroup').style.display=this.querySelector('input').value==='other'?'block':'none';
      });

function submitClaim(){
  const name=document.getElementById('fName').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  const street=document.getElementById('fStreet').value.trim();
  const city=document.getElementById('fCity').value.trim();
  const pin=document.getElementById('fPin').value.trim();
  if(!name||!phone||!street||!city||!pin){alert('Please fill in all required fields!');return;}
  if(phone.length<10){alert('Please enter a valid phone number!');return;}

  const ref='BZ'+Date.now().toString().slice(-6);
  const isFree=currentFood.type==='free';
  const moneySaved=isFree?currentFood.oldPrice:(currentFood.oldPrice-currentFood.newPrice);
  const ptsEarned=isFree?50:20;

  userPoints+=ptsEarned;totalSaved+=moneySaved;totalMeals+=1;
  document.getElementById('cartCount').textContent=claimedItems.length+1;
  document.getElementById('navPoints').textContent=userPoints;

  claimedItems.push({name:currentFood.name,emoji:currentFood.emoji,rest:currentRest.name,price:isFree?'Free':'₹'+currentFood.newPrice,saved:moneySaved,pts:ptsEarned,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ref});
  currentFood.qty=Math.max(0,currentFood.qty-1);

  const co2Saved=(totalMeals*2.5).toFixed(1);
  document.getElementById('modalTitle').textContent='';
  document.getElementById('modalBody').innerHTML=`
    <div class="success-screen">
      <div class="success-icon">🎉</div>
      <div class="success-title">Claimed Successfully!</div>
      <p class="success-sub">Your ${isFree?'free food':'order'} from <strong>${currentRest.name}</strong> is confirmed. They'll have it ready for pickup!</p>
      <div class="success-ref">Order Ref: #${ref}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0">
        <div style="background:var(--gll);border-radius:12px;padding:12px 8px;text-align:center">
          <div style="font-family:'Fraunces',serif;font-size:1.3rem;font-weight:900;color:var(--gd)">₹${moneySaved}</div>
          <div style="font-size:.66rem;color:var(--mu);margin-top:3px">Money Saved</div>
        </div>
        <div style="background:#e8f8e8;border-radius:12px;padding:12px 8px;text-align:center">
          <div style="font-family:'Fraunces',serif;font-size:1.3rem;font-weight:900;color:#27ae60">${co2Saved}kg</div>
          <div style="font-size:.66rem;color:var(--mu);margin-top:3px">CO₂ Saved</div>
        </div>
        <div style="background:linear-gradient(135deg,#fff8e1,#fff3cd);border-radius:12px;padding:12px 8px;text-align:center">
          <div style="font-family:'Fraunces',serif;font-size:1.3rem;font-weight:900;color:#f39c12">+${ptsEarned}</div>
          <div style="font-size:.66rem;color:var(--mu);margin-top:3px">Points Earned</div>
        </div>
      </div>
      <div style="background:var(--gll);border-radius:12px;padding:13px 15px;text-align:left;margin-bottom:16px">
        <div style="font-size:.76rem;font-weight:700;color:var(--gd);margin-bottom:6px">🌍 Your impact so far</div>
        <div style="font-size:.78rem;color:var(--tx);line-height:1.7">
          🥗 <strong>${totalMeals}</strong> meal${totalMeals>1?'s':''} rescued from waste<br/>
          💰 <strong>₹${totalSaved}</strong> saved total<br/>
          🌱 <strong>${(totalMeals*2.5).toFixed(1)} kg</strong> CO₂ emissions prevented<br/>
          💧 <strong>${(totalMeals*500).toLocaleString()} ml</strong> water footprint reduced<br/>
          ⭐ <strong>${userPoints} points</strong> — ${getLevel(userPoints).name} level
        </div>
      </div>
      <p style="font-size:.78rem;color:var(--mu);margin-bottom:18px">📞 Confirmation on <strong>${phone}</strong></p>
      <button class="done-btn" onclick="closeModalBtn();showList()">Back to Restaurants</button>
    </div>
  `;
}

function getLevel(pts){
  if(pts>=500)return{name:'🏆 Champion',next:null,progress:100};
  if(pts>=200)return{name:'🌟 Hero',next:500,progress:Math.round((pts-200)/3)};
  if(pts>=100)return{name:'🌿 Guardian',next:200,progress:Math.round((pts-100))};
  if(pts>=50) return{name:'🌱 Saver',next:100,progress:Math.round((pts-50)*2)};
  return{name:'🥚 Beginner',next:50,progress:Math.round(pts*2)};
}

  const co2=(totalMeals*2.5).toFixed(1);
  const water=(totalMeals*500).toLocaleString();
  const lvl=getLevel(userPoints);
  document.getElementById('modalTitle').textContent='';
  document.getElementById('modalBody').innerHTML=`

        <div class="stat-box carbon"><div class="sval">${co2}kg</div><div class="slbl">CO₂ Prevented</div></div>
      </div>
      <div class="points-card">
        <div class="pleft"><h3>⭐ ${userPoints}</h3><p>Total Points</p></div>
        <div class="pright">
          <div class="level-badge">${lvl.name}</div>
          ${lvl.next?`<div class="next-level">${lvl.next-userPoints} pts to next level</div>`:'<div class="next-level">Max level reached! 🏆</div>'}
        </div>
      </div>
      ${lvl.next?`<div style="padding:0 18px;margin-top:8px"><div class="progress-track"><div class="progress-fill" style="width:${lvl.progress}%"></div></div></div>`:''}
      <div class="eco-section">
        <div class="eco-title">🌍 Your Eco Impact</div>
        <div class="eco-cards">
          <div class="eco-card"><span class="eico">🌱</span><div><strong>${co2} kg CO₂ emissions saved</strong><span>That's like planting ${Math.max(1,Math.floor(totalMeals/2))} tree${totalMeals>=2?'s':''}!</span></div></div>
          <div class="eco-card"><span class="eico">💧</span><div><strong>${water} ml water footprint reduced</strong><span>Every meal saved reduces water waste too.</span></div></div>
          <div class="eco-card"><span class="eico">🍽️</span><div><strong>${totalMeals} meal${totalMeals!==1?'s':''} kept out of landfill</strong><span>Food waste produces methane in landfills.</span></div></div>
          <div class="eco-card"><span class="eico">❤️</span><div><strong>${totalMeals} portion${totalMeals!==1?'s':''} of food put to good use</strong><span>You're directly fighting hunger in India.</span></div></div>
        </div>
      </div>
      <div class="claims-list">
        <div class="eco-title">Recent Claims</div>
        ${claimedItems.length===0?`<div class="no-claims"><div class="ne">🍽️</div><p>No claims yet!<br/>Start rescuing food to earn points and see your impact here.</p></div>`:claimedItems.slice().reverse().map(c=>`
          <div class="claim-item">
            <span class="claim-emoji">${c.emoji}</span>
            <div class="claim-info"><div class="cname">${c.name}</div><div class="cmeta">${c.rest} · ${c.time} · Saved ₹${c.saved} · Ref #${c.ref}</div></div>
            <div class="claim-pts">+${c.pts} pts</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(e){if(e.target===document.getElementById('overlay'))closeModalBtn();}
function closeModalBtn(){document.getElementById('overlay').classList.remove('show');document.body.style.overflow='';}

renderRestaurants(restaurants);
setTimeout(()=>{if(navigator.geolocation)requestLocation();},800);
</script>
</body>
</html>
